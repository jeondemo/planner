<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>월간 계획표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--card:#FFFFFF;--card2:#F3F5F7;--today:#FFF2CC;--line:#D5DBE2;--grid:#BCC5CF;
  --text:#1B2430;--sub:#4A5562;--muted:#5A6573;--out:#8E97A1;--accent:#F0A21F;
  --school:#2F6FDE;--school-bg:#EEF3FC;--school-tx:#1E3F80;
  --personal:#E8832A;--personal-bg:#FDF2E8;--personal-tx:#8A450E;
  --pc:#A3ACB6;--pc-bg:#F2F4F6;--pc-tx:#4A5562;
  --hol:#C9302C;--hol-bg:#FBE4E4;--hol-tx:#B02E2E;
  --sun:#C9302C;--sat:#2C5FC4;
  --navy:#1F3A5F;--p-text:#FFFFFF;--p-sub:#C9D6E6;--p-muted:#A9BCD3;--p-item:rgba(255,255,255,.07);--p-line:rgba(255,255,255,.18);
  --p-school:#6EA8FE;--p-personal:#F0A35E;--p-pc:#A3ACB6;--p-hol:#FF8A8A;--gold:#F2B84B
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
button,input,textarea{font-family:inherit}
.app{height:100vh;padding:40px 40px 40px 48px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:40px}
.cal{display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;padding-top:8px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:16px;border-bottom:3px solid var(--navy)}
.title{display:flex;align-items:flex-end;gap:18px}
.title h1{margin:0;font-size:72px;font-weight:700;line-height:.9;color:var(--navy)}
.mlabel{display:flex;flex-direction:column;gap:2px;padding-bottom:2px}
.mlabel .en{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:2px}
.mlabel .y{font-size:22px;font-weight:600}
.nav{display:flex;gap:6px;margin-left:12px;padding-bottom:2px}
.btn-icon{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-icon:hover,.btn-ghost:hover{border-color:var(--muted)}
.btn-ghost{height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer}
.legend{display:flex;gap:20px;font-size:15px;color:var(--sub);padding-bottom:6px}
.legend span{display:flex;align-items:center;gap:8px}
.legend .dot{width:4px;height:16px;border-radius:2px;border:none;transform:none}
.dot{width:10px;height:10px;flex:none;display:inline-block}
.dot.school{border-radius:3px;background:var(--school)}
.dot.personal{border-radius:50%;background:var(--personal)}
.dot.pc{border-radius:2px;border:2px solid var(--pc);background:transparent;box-sizing:border-box}
.dot.holiday{border-radius:2px;transform:rotate(45deg);background:var(--hol)}
.legend .dot.school,.legend .dot.personal,.legend .dot.pc{width:4px;height:16px;border-radius:2px;border:none;transform:none}
.legend .dot.pc{background:var(--pc)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:14px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.week span{padding:0 12px}
.week span:first-child{color:var(--sun)}
.week span:last-child{color:var(--sat)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--grid);border:1px solid var(--grid)}
.cell{background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:5px;overflow:hidden;cursor:pointer;min-height:0}
.cell:hover{background:#F8FAFC}
.cell.out{background:var(--card2)}
.cell.today{background:var(--today);box-shadow:inset 0 0 0 3px var(--accent)}
.cell.sel{background:#F1F6FF;box-shadow:inset 0 0 0 3px var(--school)}
.dhead{display:flex;align-items:center;gap:8px;flex:none;min-width:0}
.hol-name{font-size:13px;font-weight:600;color:var(--hol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.out .hol-name{color:#D98B88}
.today-tag{margin-left:auto;flex:none;padding:3px 10px;border-radius:999px;background:var(--navy);color:#FFFFFF;font-size:12px;font-weight:700}
.num{font-size:18px;font-weight:700;color:var(--text);height:32px;display:inline-flex;align-items:center;flex:none}
.cell.out .num{color:var(--out)}
.num.sun,.num.hol{color:var(--sun)}
.num.sat{color:var(--sat)}
.num.sat.hol{color:var(--sun)}
.cell.today .num{justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--text);font-size:18px;font-weight:800}
.chip{display:block;font-size:13px;font-weight:500;height:23px;line-height:17px;padding:3px 8px;border-radius:3px;border:none;border-left:4px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;width:100%;cursor:pointer;flex:none;font-family:inherit}
.chip.school{background:var(--school-bg);color:var(--school-tx);border-left-color:var(--school)}
.chip.personal{background:var(--personal-bg);color:var(--personal-tx);border-left-color:var(--personal)}
.chip.pc{background:var(--pc-bg);color:var(--pc-tx);border-left-color:var(--pc)}
.chip.holiday{background:transparent;color:var(--hol);border-left:none;padding-left:2px;font-weight:700;cursor:default}
.more{font-size:12px;color:var(--muted);padding:0 4px;flex:none}
.side{background:var(--navy);color:var(--p-text);border-radius:22px;padding:32px 28px;display:flex;flex-direction:column;gap:22px;min-height:0}
.card{display:flex;flex-direction:column;gap:10px;min-height:0}
.card h2{margin:0;font-size:14px;font-weight:700;letter-spacing:1px;color:var(--p-muted)}
.clock-card,.dday,.foot{flex-shrink:0}
.clock-card{flex-direction:row;align-items:stretch;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--p-line)}
.ck-left{display:flex;flex-direction:column;justify-content:center;gap:6px;flex:none}
.ck-left .clock{font-size:50px}
.ck-left .date{font-size:14px;line-height:1.4}
.ck{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.ck-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:1px;color:var(--p-sub)}
.ck-h b{font-size:11px;color:var(--gold);letter-spacing:0}
.ck-list{display:flex;flex-direction:column;gap:2px;max-height:122px;overflow-y:auto}
.ck-empty{font-size:12px;color:var(--p-muted);padding:2px 0}
.ck-row{display:flex;align-items:center;gap:6px;min-height:24px;font-size:13px;line-height:1.35;min-width:0}
.ck-row label{flex:1;display:flex;align-items:center;gap:7px;min-width:0;cursor:pointer}
.ck-row input{width:14px;height:14px;margin:0;flex:none;accent-color:var(--gold)}
.ck-row label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-row .del{width:22px;height:22px;border:none;background:transparent;color:var(--p-muted);font-size:12px;cursor:pointer;border-radius:6px;opacity:0;flex:none;padding:0}
.ck-row:hover .del,.ck-row .del:focus{opacity:1}
.ck-row .del:hover{color:var(--p-hol)}
.ck-row.ask{background:rgba(242,184,75,.16);border-radius:6px;padding:0 6px;gap:6px}
.ck-row.ask .q{flex:1;font-size:12px;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-row.ask button{height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;flex:none;font-family:inherit}
.ck-row.ask .yes{border:none;background:var(--gold);color:#1B2430}
.ck-row.ask .no{border:1px solid rgba(255,255,255,.35);background:transparent;color:#FFFFFF}
.ck-add{height:26px;margin-top:2px;padding:0 2px;border:none;border-top:1px dashed rgba(255,255,255,.18);background:transparent;color:var(--p-text);font-size:12px;font-family:inherit;width:100%}
.ck-add::placeholder{color:var(--p-muted)}
.ck-add:focus{outline:none;border-top-color:var(--gold)}
.clock{font-size:68px;font-weight:700;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.date{font-size:18px;color:var(--p-sub)}
.day-card{flex:0 1 auto;padding:14px;margin:-14px -14px 0;border:1px solid transparent;border-radius:14px}
.day-card.sel{border-color:rgba(110,168,254,.55);background:rgba(110,168,254,.08)}
.day-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-head .rel{display:block;font-size:13px;font-weight:700;color:var(--gold);margin-bottom:2px}
.day-head .rel:empty{display:none}
.day-card.sel .day-head h2{font-size:18px;letter-spacing:0;color:var(--p-text)}
.day-actions{display:flex;align-items:center;gap:8px;flex:none}
.search{position:relative;margin-left:8px;padding-bottom:2px}
.search svg{position:absolute;left:14px;top:13px;pointer-events:none}
.search input{width:240px;height:44px;padding:0 38px 0 42px;border-radius:22px;border:1px solid var(--line);background:#FFFFFF;color:var(--text);font-size:15px}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border:2px solid var(--school);padding-left:41px}
.search button{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:14px;border:none;background:#EEF1F4;color:var(--muted);font-size:13px;cursor:pointer;display:none}
.search.has button{display:block}
mark.hl{background:#FFE08A;color:inherit;padding:0 1px;border-radius:2px}
.side mark.hl{background:rgba(242,184,75,.45);color:#FFFFFF}
.search-tools{display:flex;gap:6px;flex:none}
.range-chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--p-text);font-size:13px;cursor:pointer}
.range-chip.on{background:var(--gold);border-color:var(--gold);color:var(--text);font-weight:700}
.ev-item.res{align-items:center}
.ev-item.res.cur{background:rgba(110,168,254,.18);box-shadow:inset 0 0 0 1px rgba(242,184,75,.8)}
.res-date{width:52px;font-size:13px;color:var(--p-sub);flex:none}
body.searching .todos,body.searching .dday{display:none}
body.searching .day-card{flex:1 1 auto}
body.searching .memo{display:none}
body.pastday .todos{display:none}
body.memoview .todos,body.memoview .dday,body.memoview .memo{display:none}
body.memoview .day-card{flex:1 1 auto}
.memo{flex:1 1 auto;min-height:130px;display:flex;flex-direction:column;gap:8px;padding:12px 14px 10px;border-radius:14px;background:#FFF6D8;color:#3B2F12;box-shadow:inset 0 0 0 2px var(--gold)}
.memo.past{background:#EFE7CC;box-shadow:inset 0 0 0 2px #C9B57A}
.memo-head{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
.memo-title{font-size:14px;font-weight:700;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#3B2F12;color:#FFF6D8;flex:none}
.memo-btn{height:28px;padding:0 10px;border-radius:14px;border:1px solid #C9B57A;background:#FFFFFF;color:#3B2F12;font-size:12px;font-weight:600;cursor:pointer;flex:none;font-family:inherit}
.memo-btn:hover{border-color:#3B2F12}
.memo-text{flex:1;min-height:0;width:100%;resize:none;border:none;outline:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,rgba(180,150,70,.25) 25px,rgba(180,150,70,.25) 26px);background-attachment:local;line-height:26px;padding:0;color:#3B2F12;font-size:15px;font-family:inherit;overflow-y:auto}
.memo-text::placeholder{color:#9A8955}
.memo-view{white-space:pre-line;overflow-wrap:anywhere}
.memo-foot{font-size:11px;color:#6B5B30;text-align:right;flex:none;min-height:14px}
.memo-tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:#FFF0C2;color:#7A5A00;flex:none}
.memo-find{position:relative;flex:none}
.memo-find input{width:100%;height:42px;padding:0 14px 0 38px;border-radius:10px;border:2px solid var(--gold);background:rgba(255,255,255,.08);color:#FFFFFF;font-size:15px;font-family:inherit}
.memo-find input::placeholder{color:var(--p-muted)}
.memo-find input:focus{outline:none;background:rgba(255,255,255,.12)}
.memo-find svg{position:absolute;left:13px;top:13px;pointer-events:none}
.ev-item.memo-rec{border-left-color:var(--gold);flex-direction:column;align-items:stretch;gap:4px}
.ev-item.memo-res{border-left-color:var(--gold)}
.memo-rec-date{font-size:13px;color:var(--p-sub)}
.memo-rec-text{font-size:14px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.btn-reorder{height:32px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--p-text);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;flex:none}
.btn-reorder:hover{border-color:var(--p-text)}
.btn-reorder.on{background:var(--gold);border-color:var(--gold);color:var(--text);font-weight:700}
.grp-label{font-size:12px;font-weight:700;color:var(--p-muted);margin-top:4px}
.ev-item.reo{cursor:default;align-items:center;padding:8px 8px 8px 14px}
.ev-item.reo:hover{background:var(--p-item)}
.ev-item.reo .ev-title{flex:1}
.ev-item.moved,.ev-item.moved:hover{background:rgba(110,168,254,.18);box-shadow:inset 0 0 0 1px rgba(242,184,75,.8)}
.arrow{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--p-text);font-size:16px;cursor:pointer;flex:none}
.arrow:disabled{border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.3);cursor:default}
.arrow:not(:disabled):hover{background:var(--gold);border-color:var(--gold);color:var(--text)}
.btn-back{height:36px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--p-text);font-size:14px;cursor:pointer;flex:none}
.btn-back:hover{border-color:var(--p-text)}
.list{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
.ev-item{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 14px;border:none;border-left:4px solid var(--p-school);border-radius:0 8px 8px 0;background:var(--p-item);color:var(--p-text);cursor:pointer;width:100%;font-family:inherit}
.ev-item.personal{border-left-color:var(--p-personal)}
.ev-item.pc{border-left-color:var(--p-pc)}
.ev-item.holiday{border-left-color:var(--p-hol);cursor:default}
button.ev-item:hover{background:rgba(255,255,255,.13)}
.ev-item .dot{display:none}
.ev-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.ev-title{font-size:16px;font-weight:500;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.ev-sub{font-size:13px;color:var(--p-sub);line-height:1.4;overflow-wrap:anywhere}
.add-btn{height:44px;border-radius:10px;border:1px dashed rgba(255,255,255,.4);background:transparent;color:var(--p-text);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.add-btn:hover{border-color:var(--p-text);background:rgba(255,255,255,.06)}
.empty{font-size:15px;color:var(--p-muted)}
.todos{flex:0 1 auto}
.todo{display:flex;align-items:center;gap:8px;font-size:16px}
.todo label{flex:1;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0}
.todo label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo input{width:18px;height:18px;accent-color:var(--gold);flex:none;margin:0}
.todo.done label{color:var(--p-muted);text-decoration:line-through}
.todo .del{width:32px;height:32px;border:none;background:transparent;color:var(--p-muted);cursor:pointer;border-radius:8px;opacity:0;flex:none}
.todo:hover .del,.todo .del:focus{opacity:1}
.todo .del:hover{color:var(--p-hol)}
.todo-add{height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:var(--p-text);font-size:15px;width:100%}
.todo-add::placeholder{color:var(--p-muted)}
.todo-add:focus{outline:none;border-color:var(--p-school)}
.dday{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;border-radius:14px;background:var(--gold);color:var(--text)}
.dday .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.dday .k{font-size:14px;font-weight:600}
.dday .n{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dday .d{font-size:14px}
.dday .v{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--p-sub)}
.foot.err{color:#FFC4C4}
.foot .dot{background:#7FD1B9;border-radius:50%;width:8px;height:8px;border:none;transform:none}
.foot.err .dot{background:var(--p-hol)}
.foot button{margin-left:auto;height:32px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--p-text);font-size:13px;cursor:pointer}
.backdrop{position:fixed;inset:0;background:rgba(30,38,50,.45);display:none;align-items:center;justify-content:center;z-index:10}
.backdrop.open{display:flex}
.dialog{width:500px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;display:flex;flex-direction:column;gap:16px;color:var(--text);box-shadow:0 20px 50px rgba(30,38,50,.25)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-head .k{font-size:14px;color:var(--muted)}
.dlg-head h2{margin:2px 0 0;font-size:22px;font-weight:700}
.close{width:44px;height:44px;border-radius:10px;border:none;background:transparent;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
.field{display:flex;flex-direction:column;gap:8px}
.field>.lb,.field>label.lb{font-size:14px;color:var(--sub)}
.inp{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#FBFAF6;color:var(--text);font-size:16px;color-scheme:light;width:100%}
.inp:focus,textarea.inp:focus{outline:none;border-color:var(--school)}
textarea.inp{height:auto;padding:12px 14px;font-size:15px;resize:none}
.inp:disabled{opacity:.5}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pill{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#FBFAF6;font-size:16px;color:var(--sub);cursor:pointer}
.pill input{width:16px;height:16px;margin:0}
.pill.school input{accent-color:var(--school)}
.pill.personal input{accent-color:var(--personal)}
.pill.pc input{accent-color:var(--pc-tx)}
.pill.school:has(input:checked){border-color:var(--school);background:var(--school-bg);color:var(--text)}
.pill.personal:has(input:checked){border-color:var(--personal);background:var(--personal-bg);color:var(--text)}
.pill.pc:has(input:checked){border-color:var(--pc-tx);background:var(--pc-bg);color:var(--text)}
.cal-hint{font-size:13px;color:var(--muted)}
.timehead{display:flex;align-items:center;justify-content:space-between}
.times{display:flex;align-items:center;gap:10px}
.times .inp{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.info{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.msg{font-size:14px;color:var(--hol-tx);margin:0;min-height:20px}
.actions{display:flex;align-items:center;gap:10px}
.actions .sp{flex:1}
.btn{height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;cursor:pointer}
.btn.primary{border:none;background:var(--school);color:#FFFFFF;font-weight:600;padding:0 24px}
.btn.danger{border-color:rgba(210,60,60,.4);color:var(--hol-tx)}
.btn.danger.armed{background:var(--hol-bg)}
.btn:disabled{opacity:.5;cursor:default}
body.popup .app{display:none}
body.popup .backdrop{background:var(--card)}
body.popup .dialog{width:100%;max-width:none;height:100vh;border:none;border-radius:0;overflow-y:auto;box-shadow:none}
.done-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--card);font-size:18px}
.done-screen span{font-size:14px;color:var(--muted)}
.range-btns{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.range-btns .tilde{color:var(--muted)}
.date-btn{height:50px;border-radius:10px;border:1px solid var(--line);background:#FBFAF6;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.25;font-family:inherit}
.date-btn .lbl{font-size:11px;font-weight:500;color:var(--muted)}
.date-btn.on{border:2px solid var(--school);background:var(--school-bg)}
.date-btn.on .lbl{color:var(--school);font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line);background:#FFFFFF;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.quick button:hover{border-color:var(--muted)}
.quick button.on{background:var(--navy);border-color:var(--navy);color:#FFFFFF;font-weight:600}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mini-head{display:flex;align-items:center;justify-content:space-between}
.mini-head span{font-size:15px;font-weight:700}
.mini-head button{width:32px;height:32px;border-radius:16px;border:1px solid var(--line);background:#FFFFFF;color:var(--text);font-size:16px;cursor:pointer}
.mini-week,.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.mini-week{font-size:12px;font-weight:700;color:var(--muted)}
.mini-week span:first-child{color:var(--sun)}
.mini-week span:last-child{color:var(--sat)}
.mini-grid{row-gap:2px}
.mini-day{height:30px;border:none;background:transparent;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;border-radius:8px;font-family:inherit;padding:0}
.mini-day:hover{background:#EEF1F4}
.mini-day.sun,.mini-day.hol{color:var(--sun)}
.mini-day.sat{color:var(--sat)}
.mini-day.out{color:#B4BCC5}
.mini-day.tdy{box-shadow:inset 0 0 0 2px var(--accent)}
.mini-day.mid{background:var(--school-bg);border-radius:0}
.mini-day.edge{background:var(--navy);color:#FFFFFF;font-weight:700;border-radius:0}
.mini-day.edge.s{border-radius:15px 0 0 15px}
.mini-day.edge.e{border-radius:0 15px 15px 0}
.mini-day.edge.s.e{border-radius:15px}
.mini-day:disabled,.date-btn:disabled,.quick button:disabled{cursor:default;opacity:.6}
.dhead{height:32px}
.spacer{flex:none}
.chip.bar{position:relative;z-index:1;align-self:start;width:auto;margin:0 10px;font-weight:600}
.chip.bar.school{background:#E2EBFB}
.chip.bar.personal{background:#FCEBDA}
.chip.bar.pc{background:#E9ECF0}
.chip.bar.cont{border-left:none;margin-left:0;border-top-left-radius:0;border-bottom-left-radius:0;padding-left:10px}
.chip.bar.open{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.chip.bar:hover{filter:brightness(.96)}
</style>
</head>
<body>
<div class="app">
  <section class="cal" aria-label="월간 달력">
    <div class="head">
      <div class="title">
        <h1 id="hMonth"></h1>
        <div class="mlabel"><span class="en" id="hEn"></span><span class="y" id="hYear"></span></div>
        <div class="nav">
          <button class="btn-icon" id="prev" aria-label="이전 달">‹</button>
          <button class="btn-icon" id="next" aria-label="다음 달">›</button>
          <button class="btn-ghost" id="goToday">오늘</button>
        </div>
        <div class="search" id="searchWrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6573" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <label class="sr" for="searchInput">일정 검색</label>
          <input id="searchInput" placeholder="일정 검색" maxlength="50" autocomplete="off">
          <button id="searchClear" type="button" aria-label="검색어 지우기">✕</button>
        </div>
      </div>
      <div class="legend">
        <span><i class="dot school"></i>학교</span>
        <span><i class="dot personal"></i>개인</span>
        <span><i class="dot pc"></i>PC만</span>
        <span style="color:var(--hol);font-weight:600">공휴일</span>
      </div>
    </div>
    <div class="week"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="side" aria-label="오늘">
    <div class="card clock-card">
      <div class="ck-left">
        <span class="clock" id="clock"></span>
        <span class="date" id="today"></span>
      </div>
      <div class="ck">
        <div class="ck-h"><span>체크리스트</span><b id="ckCount"></b></div>
        <div class="ck-list" id="todoList"></div>
        <label class="sr" for="todoAdd">체크리스트 추가</label>
        <input class="ck-add" id="todoAdd" placeholder="+ 추가 (Enter)" maxlength="100" autocomplete="off">
      </div>
    </div>
    <div class="card day-card" id="dayCard">
      <div class="day-head">
        <div><span class="rel" id="dayRel"></span><h2 id="dayTitle">오늘 일정</h2></div>
        <div class="day-actions">
          <button class="btn-reorder" id="dayReorder" style="display:none"></button>
          <button class="btn-back" id="dayBack" style="display:none">오늘로</button>
          <button class="btn-back" id="searchClose" style="display:none">닫기</button>
          <button class="btn-back" id="memoClose" style="display:none">닫기</button>
        </div>
      </div>
      <div class="memo-find" id="memoFindWrap" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2B84B" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label class="sr" for="memoFindInput">메모 찾기</label>
        <input id="memoFindInput" placeholder="찾을 단어 (예: 컨설팅)" maxlength="50" autocomplete="off">
      </div>
      <div class="search-tools" id="searchTools" style="display:none">
        <button class="range-chip" data-range="3y">최근 3년</button>
        <button class="range-chip" data-range="all">전체 (10년)</button>
      </div>
      <div class="list" id="todayList"></div>
      <button class="add-btn" id="dayAdd"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>이 날에 일정 추가</button>
    </div>
    <div class="card dday" id="dday"></div>
    <div class="memo" id="memoCard">
      <div class="memo-head">
        <span class="memo-title" id="memoTitle">✎ 메모</span>
        <span class="memo-badge" id="memoBadge" style="display:none">보기 전용</span>
        <button class="memo-btn" id="memoListBtn" type="button">지난 메모</button>
        <button class="memo-btn" id="memoFindBtn" type="button">메모 찾기</button>
      </div>
      <label class="sr" for="memoText">메모</label>
      <textarea class="memo-text" id="memoText" maxlength="2000" placeholder="급하게 적어둘 내용을 쓰세요 (자동 저장)"></textarea>
      <div class="memo-text memo-view" id="memoView" style="display:none"></div>
      <span class="memo-foot" id="memoFoot"></span>
    </div>
    <div class="foot" id="foot"><i class="dot"></i><span id="footText">불러오는 중…</span><button id="refresh">새로고침</button></div>
  </aside>
</div>

<div class="backdrop" id="evBackdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head">
      <div><span class="k" id="dlgKind"></span><h2 id="dlgTitle"></h2></div>
      <button class="close" id="dlgClose" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="field">
      <label class="lb" for="fTitle">제목</label>
      <input class="inp" id="fTitle" placeholder="일정 제목 (!로 시작하면 D-day 표시)" maxlength="100" autocomplete="off">
    </div>
    <div class="field">
      <span class="lb">캘린더</span>
      <div class="pills">
        <label class="pill school"><input type="radio" name="fCal" value="school"><i class="dot school"></i>학교</label>
        <label class="pill personal"><input type="radio" name="fCal" value="personal"><i class="dot personal"></i>개인</label>
        <label class="pill pc"><input type="radio" name="fCal" value="pc"><i class="dot pc"></i>PC만</label>
      </div>
      <span class="cal-hint" id="calHint" style="display:none">PC만: 계획표에만 보이고 폰에는 표시되지 않아요</span>
    </div>
    <div class="field">
      <div class="timehead"><span class="lb" style="font-size:14px;color:var(--sub)">기간</span><span id="fDays" style="font-size:13px;font-weight:600;color:#B36A00"></span></div>
      <input type="hidden" id="fDate">
      <input type="hidden" id="fEndDate">
      <div class="range-btns">
        <button type="button" class="date-btn" id="pickStart"><span class="lbl" id="pickStartLbl">시작</span><span id="pickStartVal"></span></button>
        <span class="tilde">~</span>
        <button type="button" class="date-btn" id="pickEnd"><span class="lbl" id="pickEndLbl">끝</span><span id="pickEndVal"></span></button>
      </div>
      <div class="quick" id="quickDays">
        <button type="button" data-days="1">하루</button>
        <button type="button" data-days="2">2일</button>
        <button type="button" data-days="3">3일</button>
        <button type="button" data-days="5">5일</button>
        <button type="button" data-days="7">1주</button>
      </div>
      <div class="mini">
        <div class="mini-head"><button type="button" id="miniPrev" aria-label="이전 달">‹</button><span id="miniTitle"></span><button type="button" id="miniNext" aria-label="다음 달">›</button></div>
        <div class="mini-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="mini-grid" id="miniGrid"></div>
      </div>
    </div>
    <div class="field">
      <label class="lb" for="fMemo">메모 (선택)</label>
      <textarea class="inp" id="fMemo" rows="2" placeholder="장소나 준비물 등을 적어두세요"></textarea>
    </div>
    <div class="info" id="dlgInfo"></div>
    <p class="msg" id="dlgMsg" role="alert"></p>
    <div class="actions">
      <button class="btn danger" id="dlgDelete">삭제</button>
      <span class="sp"></span>

      <button class="btn primary" id="dlgSave">저장</button>

</div>

<div class="backdrop" id="keyBackdrop">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
    <div class="dlg-head"><div><span class="k">처음 한 번만</span><h2 id="keyTitle">API 키 입력</h2></div></div>
    <div class="field">
      <label class="lb" for="keyInput">GAS setup 실행 로그에 나온 API 키</label>
      <input class="inp" id="keyInput" autocomplete="off">
    </div>
    <p class="msg" id="keyMsg" role="alert"></p>
    <div class="actions"><span class="sp"></span><button class="btn primary" id="keySave">저장</button></div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwf2YCDrjZ8IbvF-Syi1vV44aERHHhdpb5zH3pMiMga_tkg4qsexSnfBGsi6YA6NP7P/exec';
const EN_MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEK = ['일','월','화','수','목','금','토'];
const REFRESH_MS = 5 * 60 * 1000;
const SEL_RESET_MS = 60 * 1000;
const PARAMS = new URLSearchParams(location.search);
const WALLPAPER = PARAMS.get('mode') === 'wallpaper';
const POPUP = PARAMS.get('popup') || '';
let channel = null;
try { channel = new BroadcastChannel('planner'); } catch (e) {}

const now = new Date();
const state = { y: now.getFullYear(), m: now.getMonth(), events: [], todos: [], synced: '', error: '', key: '', modal: null, dayKey: '' };
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseYmd = (s) => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const todayDate = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const korDate = (d) => (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';

function loadKey() {
  const m = (location.hash + location.search).match(/key=([A-Za-z0-9]+)/);
  if (m) return m[1];
  try { return localStorage.getItem('planner_key') || ''; } catch (e) { return ''; }
}
function saveKey(k) {
  try { localStorage.setItem('planner_key', k); } catch (e) {}
}

async function api(action, params, post) {
  const payload = Object.assign({}, params || {}, { action: action, key: state.key });
  const res = post
    ? await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
    : await fetch(API_URL + '?' + new URLSearchParams(Object.assign(payload, { _: Date.now() })), { cache: 'no-store' });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || '요청 실패');
  return data;
}

function gridRange() {
  const first = new Date(state.y, state.m, 1);
  const start = addDays(first, -first.getDay());
  const days = new Date(state.y, state.m + 1, 0).getDate();
  const rows = Math.ceil((first.getDay() + days) / 7);
  return { start: start, rows: rows, end: addDays(start, rows * 7) };
}

async function load() {
  if (!state.key) { openKey(); return; }
  const g = gridRange();
  const t = todayDate();
  const from = g.start < t ? g.start : t;
  const ddEnd = addDays(t, 150);
  const to = g.end > ddEnd ? g.end : ddEnd;
  try {
    const results = await Promise.all([api('list', { start: ymd(from), end: ymd(to) }), api('getTodos'), api('getOrder'), api('getMemo')]);
    applyMemo(results[3].memo);
    state.events = results[0].events;
    state.synced = results[0].syncedAt;
    state.todos = results[1].todos;
    state.order = results[2].order || {};
    state.error = '';
  } catch (e) {
    state.error = e.message === 'unauthorized' ? 'API 키가 맞지 않습니다' : '연결 실패: ' + e.message;
    if (e.message === 'unauthorized') openKey('API 키가 맞지 않습니다. 다시 입력해 주세요.');
  }
  render();
}

function eventsOn(dateStr) {
  const list = state.events.filter((ev) => {
    const s = ev.start.slice(0, 10);
    let e = ev.end.slice(0, 10);
    if (ev.allDay) return s <= dateStr && dateStr < e;
    if (e > s && ev.end.slice(11) === '00:00') e = ymd(addDays(parseYmd(e), -1));
    return s <= dateStr && dateStr <= e;
  });
  const order = { holiday: 0, personal: 1, school: 2, pc: 3 };
  const rank = (ev) => (ev.cal in order ? order[ev.cal] : 9);
  const ord = (state.order && state.order[dateStr]) || [];
  const pos = (ev) => { const i = ord.indexOf(ev.id); return i < 0 ? 1e6 : i; };
  return list.sort((a, b) => rank(a) - rank(b) || pos(a) - pos(b) || a.start.localeCompare(b.start));
}

function lastDay(ev) {
  const s = ev.start.slice(0, 10);
  const e = ev.end.slice(0, 10);
  if (e <= s) return s;
  if (ev.allDay || ev.end.slice(11) === '00:00') return ymd(addDays(parseYmd(e), -1));
  return e;
}

function chipLabel(ev) {
  return ev.title;
}

function renderHeader() {
  $('hYear').textContent = state.y + '년 ' + (state.m + 1) + '월';
  $('hMonth').textContent = state.m + 1;
  $('hEn').textContent = EN_MONTH[state.m].toUpperCase();
}

function isMulti(ev) {
  return ev.cal !== 'holiday' && lastDay(ev) > ev.start.slice(0, 10);
}

function weekBars(ws) {
  const we = ymd(addDays(parseYmd(ws), 6));
  const order = { personal: 0, school: 1, pc: 2 };
  const list = state.events.filter((ev) => isMulti(ev) && ev.start.slice(0, 10) <= we && lastDay(ev) >= ws);
  list.sort((a, b) => a.start.localeCompare(b.start) || lastDay(b).localeCompare(lastDay(a)) || order[a.cal] - order[b.cal]);
  const lanes = [];
  return list.map((ev) => {
    const s = ev.start.slice(0, 10);
    const e = lastDay(ev);
    const c0 = s < ws ? 0 : Math.round((parseYmd(s) - parseYmd(ws)) / 86400000);
    const c1 = e > we ? 6 : Math.round((parseYmd(e) - parseYmd(ws)) / 86400000);
    let lane = 0;
    while (lanes[lane] && lanes[lane].some((x) => x <= c1 && x >= c0)) lane++;
    if (!lanes[lane]) lanes[lane] = [];
    for (let c = c0; c <= c1; c++) lanes[lane].push(c);
    return { ev: ev, c0: c0, c1: c1, lane: lane, cont: s < ws, open: e > we };
  });
}

function renderGrid() {
  const g = gridRange();
  const grid = $('grid');
  grid.style.gridTemplateRows = 'repeat(' + g.rows + ', minmax(0, 1fr))';
  grid.replaceChildren();
  const tStr = ymd(todayDate());
  const maxChips = g.rows === 6 ? 2 : 3;
  const q = state.search ? state.search.q : '';
  for (let r = 0; r < g.rows; r++) {
    const ws = ymd(addDays(g.start, r * 7));
    const bars = weekBars(ws);
    for (let c = 0; c < 7; c++) {
      const d = addDays(g.start, r * 7 + c);
      const ds = ymd(d);
      const cell = el('div', 'cell');
      cell.style.gridRow = String(r + 1);
      cell.style.gridColumn = String(c + 1);
      if (d.getMonth() !== state.m) cell.classList.add('out');
      if (ds === tStr) cell.classList.add('today');
      if (state.sel && ds === state.sel && ds !== tStr) cell.classList.add('sel');
      const evs = eventsOn(ds);
      const singles = evs.filter((e) => !isMulti(e) && e.cal !== 'holiday');
      const hols = evs.filter((e) => e.cal === 'holiday').map((e) => e.title);
      const num = el('span', 'num', d.getDate());
      if (d.getDay() === 0) num.classList.add('sun');
      if (d.getDay() === 6) num.classList.add('sat');
      if (evs.some((e) => e.cal === 'holiday')) num.classList.add('hol');
      const head = el('div', 'dhead');
      head.appendChild(num);
      if (hols.length) {
        const hn = el('span', 'hol-name', hols.join(', '));
        hn.title = hols.join(', ');
        head.appendChild(hn);
      }
      if (ds !== tStr && state.memoDays && state.memoDays.has(ds)) head.appendChild(el('span', 'memo-tag', '메모'));
      if (ds === tStr) head.appendChild(el('span', 'today-tag', '오늘'));
      cell.appendChild(head);
      const dayBars = bars.filter((b) => b.c0 <= c && b.c1 >= c);
      const shownLanes = dayBars.filter((b) => b.lane < maxChips).reduce((m, b) => Math.max(m, b.lane + 1), 0);
      const hiddenBars = dayBars.filter((b) => b.lane >= maxChips).length;
      if (shownLanes) {
        const sp = el('div', 'spacer');
        sp.style.height = (shownLanes * 28 - 5) + 'px';
        cell.appendChild(sp);
      }
      const slots = Math.max(0, maxChips - shownLanes);
      singles.slice(0, slots).forEach((ev) => {
        const chip = el('span', 'chip ' + ev.cal);
        appendHL(chip, chipLabel(ev), q);
        cell.appendChild(chip);
      });
      const more = Math.max(0, singles.length - slots) + hiddenBars;
      if (more) cell.appendChild(el('span', 'more', '+' + more + '개 더'));
      cell.setAttribute('aria-label', korDate(d) + ' 보기');
      cell.addEventListener('click', () => selectDay(ds));
      grid.appendChild(cell);
    }
    bars.filter((b) => b.lane < maxChips).forEach((b) => {
      const bar = el('span', 'chip bar ' + b.ev.cal + (b.cont ? ' cont' : '') + (b.open ? ' open' : ''));
      bar.style.gridRow = String(r + 1);
      bar.style.gridColumn = (b.c0 + 1) + ' / span ' + (b.c1 - b.c0 + 1);
      bar.style.marginTop = (47 + b.lane * 28) + 'px';
      if (b.cont) bar.appendChild(document.createTextNode('◂ '));
      appendHL(bar, chipLabel(b.ev), q);
      bar.title = b.ev.title;
      bar.addEventListener('click', (e) => { e.stopPropagation(); selectDay(b.ev.start.slice(0, 10)); });
      grid.appendChild(bar);
    });
  }
}

function selectDay(ds) {
  if (state.search) clearSearchUI();
  if (state.memoMode) clearMemoMode();
  state.reorder = false;
  state.moved = '';
  state.sel = ds === ymd(todayDate()) ? '' : ds;
  state.selAt = Date.now();
  renderGrid();
  renderDay();
}

function relLabel(ds) {
  const diff = Math.round((parseYmd(ds) - todayDate()) / 86400000);
  if (diff === 1) return '내일';
  if (diff === 2) return '모레';
  if (diff === -1) return '어제';
  return diff > 0 ? diff + '일 후' : (-diff) + '일 전';
}

function shortDate(s) {
  return (+s.slice(5, 7)) + '/' + (+s.slice(8, 10));
}

function renderDay() {
  const t = todayDate();
  const ts = ymd(t);
  $('today').replaceChildren(t.getFullYear() + '년 ' + (t.getMonth() + 1) + '월 ' + t.getDate() + '일', el('br'), WEEK[t.getDay()] + '요일');
  $('searchTools').style.display = state.search ? '' : 'none';
  $('searchClose').style.display = state.search ? '' : 'none';
  $('memoClose').style.display = state.memoMode ? '' : 'none';
  $('memoFindWrap').style.display = state.memoMode === 'find' ? '' : 'none';
  if (state.search) { renderSearch(); return; }
  if (state.memoMode) { renderMemoPanel(); return; }
  const ds = state.sel || ts;
  const isToday = ds === ts;
  renderMemoCard(ds);
  $('dayCard').classList.toggle('sel', !isToday);
  $('dayRel').textContent = isToday ? '' : relLabel(ds);
  $('dayTitle').textContent = (isToday ? '오늘 일정' : korDate(parseYmd(ds)) + ' 일정') + (state.reorder ? ' · 순서 바꾸는 중' : '');
  $('dayBack').style.display = isToday || state.reorder ? 'none' : '';
  const list = $('todayList');
  list.replaceChildren();
  const evs = eventsOn(ds);
  const own = evs.filter((e) => e.cal !== 'holiday');
  const canReorder = ['personal', 'school', 'pc'].some((c) => own.filter((e) => e.cal === c).length > 1);
  if (!canReorder) state.reorder = false;
  const rb = $('dayReorder');
  rb.style.display = canReorder ? '' : 'none';
  rb.classList.toggle('on', !!state.reorder);
  rb.replaceChildren();
  if (state.reorder) {
    rb.textContent = '완료';
  } else {
    rb.insertAdjacentHTML('beforeend', '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>');
    rb.appendChild(document.createTextNode('순서 바꾸기'));
  }
  $('dayAdd').style.display = state.reorder ? 'none' : '';
  if (state.reorder) { renderReorder(list, ds, own); return; }
  if (!evs.length) list.appendChild(el('span', 'empty', '일정이 없습니다'));
  evs.forEach((ev) => {
    const item = el(ev.cal === 'holiday' ? 'div' : 'button', 'ev-item ' + ev.cal);
    item.appendChild(el('i', 'dot ' + ev.cal));
    const body = el('span', 'ev-body');
    body.appendChild(el('span', 'ev-title', ev.title));
    const sub = [];
    sub.push(ev.cal === 'school' ? '학교' : ev.cal === 'personal' ? '개인' : ev.cal === 'pc' ? 'PC만 · 폰에는 안 보임' : '공휴일');
    const s = ev.start.slice(0, 10);
    const last = lastDay(ev);
    if (last !== s) sub.push(shortDate(s) + '~' + shortDate(last));
    if (!ev.allDay && s === ds) sub.push(ev.start.slice(11, 16));
    if (ev.memo) sub.push(ev.memo.split('\n')[0].slice(0, 60));
    body.appendChild(el('span', 'ev-sub', sub.join(' · ')));
    item.appendChild(body);
    if (ev.cal !== 'holiday') { item.type = 'button'; item.addEventListener('click', () => openEdit(ev)); }
    list.appendChild(item);
  });
}

function appendHL(node, text, q) {
  if (!q) { node.appendChild(document.createTextNode(text)); return; }
  const lower = text.toLowerCase();
  const lq = q.toLowerCase();
  let i = 0;
  while (true) {
    const j = lower.indexOf(lq, i);
    if (j < 0) { node.appendChild(document.createTextNode(text.slice(i))); break; }
    if (j > i) node.appendChild(document.createTextNode(text.slice(i, j)));
    node.appendChild(el('mark', 'hl', text.slice(j, j + q.length)));
    i = j + q.length;
  }
}

function memoSnippet(m, q) {
  const i = m.toLowerCase().indexOf(q.toLowerCase());
  const a = Math.max(0, i - 15);
  return (a > 0 ? '…' : '') + m.slice(a, i + q.length + 30).replace(/\n/g, ' ');
}

function clearSearchUI() {
  state.search = null;
  $('searchInput').value = '';
  $('searchWrap').classList.remove('has');
  document.body.classList.remove('searching');
}

function closeSearch() {
  clearSearchUI();
  state.sel = '';
  renderGrid();
  renderDay();
}

async function runSearch(range) {
  const q = $('searchInput').value.trim();
  if (!q) { closeSearch(); return; }
  const r = range || (state.search && state.search.q === q ? state.search.range : '3y');
  state.search = { q: q, range: r, results: [], loading: true, error: '' };
  state.reorder = false;
  state.selAt = Date.now();
  document.body.classList.add('searching');
  renderGrid();
  renderDay();
  const tok = state.searchTok = (state.searchTok || 0) + 1;
  try {
    const res = await api('search', { q: q, range: r });
    if (tok !== state.searchTok || !state.search) return;
    state.search.results = res.events || [];
    state.search.memos = res.memos || [];
  } catch (e) {
    if (tok !== state.searchTok || !state.search) return;
    state.search.error = e.message;
  }
  state.search.loading = false;
  state.selAt = Date.now();
  renderDay();
}

function jumpTo(ds) {
  const d = parseYmd(ds);
  const moved = d.getFullYear() !== state.y || d.getMonth() !== state.m;
  state.y = d.getFullYear();
  state.m = d.getMonth();
  state.sel = ds;
  state.selAt = Date.now();
  render();
  if (moved) load();
}

function renderSearch() {
  const sr = state.search;
  $('dayCard').classList.add('sel');
  const memos = sr.memos || [];
  $('dayRel').textContent = sr.loading ? '검색 중…' : '검색 결과 ' + (sr.results.length + memos.length) + '건';
  $('dayTitle').textContent = '"' + sr.q + '"';
  $('dayBack').style.display = 'none';
  $('dayReorder').style.display = 'none';
  $('dayAdd').style.display = 'none';
  document.querySelectorAll('.range-chip').forEach((b) => b.classList.toggle('on', b.dataset.range === sr.range));
  const list = $('todayList');
  list.replaceChildren();
  if (sr.error) { list.appendChild(el('span', 'empty', '검색 실패: ' + sr.error)); return; }
  if (sr.loading) return;
  if (!sr.results.length && !memos.length) {
    list.appendChild(el('span', 'empty', sr.range === '3y' ? '최근 3년 안에 결과가 없습니다. 전체(10년)로 넓혀보세요.' : '결과가 없습니다.'));
    return;
  }
  const all = sr.results.map((ev) => ({ d: ev.start.slice(0, 10), ev: ev }))
    .concat(memos.map((m) => ({ d: m.date, memo: m })))
    .sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
  let cur = '';
  all.forEach((row) => {
    const d = row.d;
    const ym = d.slice(0, 7);
    if (ym !== cur) {
      cur = ym;
      list.appendChild(el('span', 'grp-label', (+d.slice(0, 4)) + '년 ' + (+d.slice(5, 7)) + '월'));
    }
    if (row.memo) {
      const mi = el('button', 'ev-item res memo-res' + (state.sel === d ? ' cur' : ''));
      mi.type = 'button';
      mi.appendChild(el('span', 'res-date', d.slice(8, 10) + ' (' + WEEK[parseYmd(d).getDay()] + ')'));
      const mb = el('span', 'ev-body');
      mb.appendChild(el('span', 'ev-title', '메모 기록'));
      const ms = el('span', 'ev-sub');
      appendHL(ms, matchLines(row.memo.text, sr.q), sr.q);
      mb.appendChild(ms);
      mi.appendChild(mb);
      mi.addEventListener('click', () => jumpTo(d));
      list.appendChild(mi);
      return;
    }
    const ev = row.ev;
    const item = el('button', 'ev-item res ' + ev.cal + (state.sel === d ? ' cur' : ''));
    item.type = 'button';
    item.appendChild(el('span', 'res-date', d.slice(8, 10) + ' (' + WEEK[parseYmd(d).getDay()] + ')'));
    const body = el('span', 'ev-body');
    const t = el('span', 'ev-title');
    appendHL(t, ev.title, sr.q);
    body.appendChild(t);
    if (ev.title.toLowerCase().indexOf(sr.q.toLowerCase()) < 0 && ev.memo) {
      const sub = el('span', 'ev-sub');
      sub.appendChild(document.createTextNode('메모: '));
      appendHL(sub, memoSnippet(ev.memo, sr.q), sr.q);
      body.appendChild(sub);
    }
    item.appendChild(body);
    item.addEventListener('click', () => jumpTo(d));
    list.appendChild(item);
  });
}

function applyMemo(m) {
  if (!m) return;
  state.memoDays = new Set(m.days || []);
  if (state.memoDirty) return;
  const keep = {};
  if (m.savedDate && m.text) keep[m.savedDate] = { date: m.savedDate, text: m.text, at: m.savedAt || '' };
  state.memoRecs = keep;
  state.memoList = null;
  if (document.activeElement !== $('memoText')) state.memoDate = '';
}

function matchLines(text, q) {
  const lq = q.toLowerCase();
  const lines = text.split('\n').filter((l) => l.toLowerCase().indexOf(lq) !== -1);
  return lines.length ? lines.join('\n') : text.slice(0, 80);
}

let memoTimer = null;

async function saveMemo() {
  clearTimeout(memoTimer);
  const date = state.memoDate;
  if (!date) return;
  const text = $('memoText').value;
  state.memoDirty = false;
  try {
    const r = await api('setMemo', { text: text, date: date }, true);
    const had = state.memoDays && state.memoDays.has(date);
    if (!state.memoDays) state.memoDays = new Set();
    if (text.trim()) state.memoDays.add(date); else state.memoDays.delete(date);
    if (!state.memoRecs) state.memoRecs = {};
    state.memoRecs[date] = text.trim() ? { date: date, text: text, at: r.savedAt } : null;
    state.memoList = null;
    if (state.memoDate === date) {
      if ($('memoText').value !== text) state.memoDirty = true;
      $('memoFoot').textContent = '저장됨 · ' + r.savedAt;
    }
    if (had !== state.memoDays.has(date)) renderGrid();
  } catch (e) {
    if (state.memoDate === date) {
      state.memoDirty = true;
      $('memoFoot').textContent = '저장 실패: ' + e.message;
    }
  }
}

async function fetchMemoDay(ds) {
  if (!state.memoRecs) state.memoRecs = {};
  if (state.memoFetching === ds) return;
  state.memoFetching = ds;
  try {
    const r = await api('getMemoDay', { date: ds });
    state.memoRecs[ds] = r.record || null;
  } catch (e) {
    state.memoRecs[ds] = { date: ds, text: '', at: '', error: e.message };
  }
  state.memoFetching = '';
  if ((state.sel || ymd(todayDate())) === ds) {
    if (state.memoDate === ds && !state.memoDirty) state.memoDate = '';
    renderMemoCard(ds);
  }
}

function bindMemo(ds) {
  if (state.memoDate === ds) return;
  if (state.memoDirty && state.memoDate) saveMemo();
  state.memoDirty = false;
  const ta = $('memoText');
  const rec = state.memoRecs ? state.memoRecs[ds] : undefined;
  if (rec === undefined && state.memoDays && state.memoDays.has(ds)) {
    ta.value = '';
    ta.readOnly = true;
    ta.placeholder = '불러오는 중…';
    $('memoFoot').textContent = '';
    fetchMemoDay(ds);
    return;
  }
  state.memoDate = ds;
  ta.readOnly = false;
  ta.placeholder = '이 날 메모를 쓰세요 (자동 저장)';
  ta.value = rec && rec.text ? rec.text : '';
  $('memoFoot').textContent = rec && rec.error ? '불러오기 실패: ' + rec.error : rec && rec.at ? '저장됨 · ' + rec.at : '';
}

function renderMemoCard(ds) {
  const ts = ymd(todayDate());
  document.body.classList.toggle('pastday', ds < ts);
  $('memoCard').classList.remove('past');
  $('memoText').style.display = '';
  $('memoView').style.display = 'none';
  $('memoBadge').style.display = 'none';
  const d = parseYmd(ds);
  $('memoTitle').textContent = ds === ts ? '✎ 오늘 메모' : '✎ ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 메모';
  bindMemo(ds);
}

function clearMemoMode() {
  state.memoMode = null;
  document.body.classList.remove('memoview');
}

function closeMemoMode() {
  clearMemoMode();
  renderDay();
}

async function openMemoMode(mode) {
  if (state.memoDirty) saveMemo();
  if (state.search) clearSearchUI();
  state.reorder = false;
  state.memoMode = mode;
  state.selAt = Date.now();
  document.body.classList.add('memoview');
  if (mode === 'find') $('memoFindInput').value = state.memoQ || '';
  renderDay();
  if (mode === 'find') focusSoon($('memoFindInput'));
  if (!state.memoList) {
    state.memoListError = '';
    try {
      const r = await api('memoList');
      state.memoList = r.records || [];
      if (!state.memoRecs) state.memoRecs = {};
      state.memoList.forEach((x) => { state.memoRecs[x.date] = x; });
    } catch (e) {
      state.memoListError = e.message;
    }
    if (state.memoMode) renderDay();
  }
}

function renderMemoPanel() {
  const mode = state.memoMode;
  $('dayCard').classList.add('sel');
  document.body.classList.remove('pastday');
  $('dayBack').style.display = 'none';
  $('dayReorder').style.display = 'none';
  $('dayAdd').style.display = 'none';
  $('dayTitle').textContent = mode === 'find' ? '메모 찾기' : '지난 메모';
  const list = $('todayList');
  list.replaceChildren();
  if (state.memoListError) { $('dayRel').textContent = ''; list.appendChild(el('span', 'empty', '불러오기 실패: ' + state.memoListError)); return; }
  if (!state.memoList) { $('dayRel').textContent = '불러오는 중…'; return; }
  const q = mode === 'find' ? (state.memoQ || '').trim() : '';
  let items = state.memoList;
  if (mode === 'find') {
    items = q ? items.filter((r) => r.text.toLowerCase().indexOf(q.toLowerCase()) !== -1) : [];
    $('dayRel').textContent = q ? '메모 검색 ' + items.length + '건' : '찾을 단어를 입력하세요';
    if (q && !items.length) list.appendChild(el('span', 'empty', '"' + q + '"가 들어간 메모가 없습니다'));
  } else {
    $('dayRel').textContent = '기록 ' + items.length + '일';
    if (!items.length) list.appendChild(el('span', 'empty', '아직 메모 기록이 없습니다'));
  }
  let cur = '';
  items.forEach((r) => {
    const ym = r.date.slice(0, 7);
    if (ym !== cur) {
      cur = ym;
      list.appendChild(el('span', 'grp-label', (+r.date.slice(0, 4)) + '년 ' + (+r.date.slice(5, 7)) + '월'));
    }
    const item = el('button', 'ev-item memo-rec');
    item.type = 'button';
    const d = parseYmd(r.date);
    item.appendChild(el('span', 'memo-rec-date', d.getDate() + '일 (' + WEEK[d.getDay()] + ')' + (r.at ? ' · ' + r.at : '')));
    const t = el('span', 'memo-rec-text');
    if (q) appendHL(t, matchLines(r.text, q), q);
    else t.textContent = r.text;
    item.appendChild(t);
    item.addEventListener('click', () => { clearMemoMode(); jumpTo(r.date); });
    list.appendChild(item);
  });
}

function renderReorder(list, ds, own) {
  const names = { personal: '개인', school: '학교', pc: 'PC만' };
  ['personal', 'school', 'pc'].forEach((c) => {
    const grp = own.filter((e) => e.cal === c);
    if (!grp.length) return;
    list.appendChild(el('span', 'grp-label', names[c]));
    grp.forEach((ev, i) => {
      const item = el('div', 'ev-item reo ' + c + (state.moved === ev.id ? ' moved' : ''));
      item.appendChild(el('span', 'ev-title', ev.title));
      const up = el('button', 'arrow', '↑');
      up.type = 'button';
      up.setAttribute('aria-label', ev.title + ' 위로');
      up.disabled = i === 0;
      up.addEventListener('click', () => moveEvent(ds, ev.id, -1));
      const down = el('button', 'arrow', '↓');
      down.type = 'button';
      down.setAttribute('aria-label', ev.title + ' 아래로');
      down.disabled = i === grp.length - 1;
      down.addEventListener('click', () => moveEvent(ds, ev.id, 1));
      item.appendChild(up);
      item.appendChild(down);
      list.appendChild(item);
    });
  });
}

async function moveEvent(ds, id, dir) {
  const own = eventsOn(ds).filter((e) => e.cal !== 'holiday');
  const i = own.findIndex((e) => e.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= own.length || own[j].cal !== own[i].cal) return;
  const ids = own.map((e) => e.id);
  [ids[i], ids[j]] = [ids[j], ids[i]];
  if (!state.order) state.order = {};
  state.order[ds] = ids;
  state.moved = id;
  state.selAt = Date.now();
  renderGrid();
  renderDay();
  try { await api('setOrder', { date: ds, ids: ids }, true); }
  catch (e) { state.error = '순서 저장 실패: ' + e.message; renderFoot(); }
}

function renderDday() {
  const box = $('dday');
  box.replaceChildren();
  const ts = ymd(todayDate());
  const target = state.events
    .filter((ev) => ev.cal !== 'holiday' && /^[!！★]/.test(ev.title) && ev.start.slice(0, 10) >= ts)
    .sort((a, b) => a.start.localeCompare(b.start))[0];
  const l = el('div', 'l');
  if (!target) {
    l.appendChild(el('span', 'k', '다가오는 일정'));
    l.appendChild(el('span', 'd', '제목을 !로 시작하면 여기에 D-day가 표시됩니다'));
    box.appendChild(l);
    return;
  }
  const d = parseYmd(target.start.slice(0, 10));
  const diff = Math.round((d - todayDate()) / 86400000);
  l.appendChild(el('span', 'k', '다가오는 일정'));
  l.appendChild(el('span', 'n', target.title.replace(/^[!！★]\s*/, '')));
  l.appendChild(el('span', 'd', korDate(d)));
  box.appendChild(l);
  box.appendChild(el('span', 'v', diff === 0 ? 'D-DAY' : 'D-' + diff));
}

let ckTimer = null;

function renderTodos() {
  const list = $('todoList');
  list.replaceChildren();
  if (state.ckAsk && state.todos.indexOf(state.ckAsk) === -1) state.ckAsk = null;
  const left = state.todos.length;
  $('ckCount').textContent = left ? left + '개 남음' : '';
  if (!left) list.appendChild(el('span', 'ck-empty', '비어 있음'));
  state.todos.forEach((t) => {
    if (state.ckAsk === t) {
      const row = el('div', 'ck-row ask');
      row.appendChild(el('span', 'q', '삭제할까요?'));
      const yes = el('button', 'yes', '네');
      yes.type = 'button';
      yes.addEventListener('click', () => {
        clearTimeout(ckTimer);
        state.ckAsk = null;
        state.todos.splice(state.todos.indexOf(t), 1);
        saveTodos();
      });
      const no = el('button', 'no', '아니요');
      no.type = 'button';
      no.addEventListener('click', () => { clearTimeout(ckTimer); state.ckAsk = null; renderTodos(); });
      row.appendChild(yes);
      row.appendChild(no);
      row.title = t.text;
      list.appendChild(row);
      return;
    }
    const row = el('div', 'ck-row');
    const lb = el('label');
    const cb = el('input');
    cb.type = 'checkbox';
    cb.addEventListener('change', () => {
      clearTimeout(ckTimer);
      state.ckAsk = t;
      renderTodos();
      ckTimer = setTimeout(() => { if (state.ckAsk === t) { state.ckAsk = null; renderTodos(); } }, 5000);
    });
    lb.appendChild(cb);
    lb.appendChild(el('span', '', t.text));
    lb.title = t.text;
    const del = el('button', 'del', '✕');
    del.type = 'button';
    del.setAttribute('aria-label', t.text + ' 삭제');
    del.addEventListener('click', () => { state.todos.splice(state.todos.indexOf(t), 1); saveTodos(); });
    row.appendChild(lb);
    row.appendChild(del);
    list.appendChild(row);
  });
}

function renderFoot() {
  const foot = $('foot');
  foot.classList.toggle('err', !!state.error);
  $('footText').textContent = state.error || ('구글 캘린더 연동 · ' + state.synced + ' 동기화');
}

function render() {
  renderHeader();
  renderGrid();
  renderDay();
  renderDday();
  renderTodos();
  renderFoot();
}

async function saveTodos() {
  renderTodos();
  try { await api('setTodos', { todos: state.todos }, true); }
  catch (e) { state.error = '할 일 저장 실패: ' + e.message; renderFoot(); }
}

function updateCalHint() {
  const c = document.querySelector('input[name="fCal"]:checked');
  $('calHint').style.display = c && c.value === 'pc' ? '' : 'none';
}

function updateDays(fromStart) {
  const s = $('fDate').value;
  const e = $('fEndDate').value;
  if (s && (!e || e < s || fromStart && !state.modal.endTouched)) $('fEndDate').value = s;
  const end = $('fEndDate').value;
  const n = s && end ? Math.round((parseYmd(end) - parseYmd(s)) / 86400000) + 1 : 0;
  $('fDays').textContent = n > 1 ? n + '일간' : '';
}

function fmtPick(ds) {
  const d = parseYmd(ds);
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')';
}

function startPicker(readOnly) {
  const d = parseYmd($('fDate').value || ymd(todayDate()));
  state.pick = { target: 'end', y: d.getFullYear(), m: d.getMonth(), ro: !!readOnly };
  renderPicker();
}

function renderPicker() {
  const p = state.pick;
  if (!p) return;
  const s = $('fDate').value;
  const e = $('fEndDate').value || s;
  $('pickStartVal').textContent = s ? fmtPick(s) : '';
  $('pickEndVal').textContent = e ? fmtPick(e) : '';
  $('pickStart').classList.toggle('on', !p.ro && p.target === 'start');
  $('pickEnd').classList.toggle('on', !p.ro && p.target === 'end');
  $('pickStartLbl').textContent = !p.ro && p.target === 'start' ? '시작 · 날짜를 고르세요' : '시작';
  $('pickEndLbl').textContent = !p.ro && p.target === 'end' ? '끝 · 날짜를 고르세요' : '끝';
  const n = s && e ? Math.round((parseYmd(e) - parseYmd(s)) / 86400000) + 1 : 0;
  document.querySelectorAll('#quickDays button').forEach((b) => {
    b.classList.toggle('on', +b.dataset.days === n);
    b.disabled = p.ro;
  });
  ['pickStart', 'pickEnd', 'miniPrev', 'miniNext'].forEach((id) => { $(id).disabled = p.ro; });
  $('miniTitle').textContent = p.y + '년 ' + (p.m + 1) + '월';
  const grid = $('miniGrid');
  grid.replaceChildren();
  const first = new Date(p.y, p.m, 1);
  const start = addDays(first, -first.getDay());
  const tStr = ymd(todayDate());
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const ds = ymd(d);
    const b = el('button', 'mini-day', d.getDate());
    b.type = 'button';
    if (d.getMonth() !== p.m) b.classList.add('out');
    if (d.getDay() === 0) b.classList.add('sun');
    if (d.getDay() === 6) b.classList.add('sat');
    if (state.events.some((ev) => ev.cal === 'holiday' && ev.start.slice(0, 10) === ds)) b.classList.add('hol');
    if (ds === tStr) b.classList.add('tdy');
    if (s && e) {
      if (ds === s) b.classList.add('edge', 's');
      if (ds === e) b.classList.add('edge', 'e');
      if (ds > s && ds < e) b.classList.add('mid');
    }
    b.setAttribute('aria-label', fmtPick(ds));
    b.disabled = p.ro;
    b.addEventListener('click', () => pickDate(ds));
    grid.appendChild(b);
  }
}

function pickDate(ds) {
  const p = state.pick;
  if (!p || p.ro) return;
  const s = $('fDate').value;
  const e = $('fEndDate').value || s;
  if (p.target === 'start') {
    $('fDate').value = ds;
    if (e < ds || !state.modal.endTouched) $('fEndDate').value = ds;
    p.target = 'end';
  } else {
    if (ds < s) { $('fDate').value = ds; $('fEndDate').value = ds; }
    else $('fEndDate').value = ds;
    state.modal.endTouched = true;
  }
  updateDays(false);
  renderPicker();
}

function quickDays(n) {
  if (!state.pick || state.pick.ro) return;
  const s = $('fDate').value;
  if (!s) return;
  $('fEndDate').value = ymd(addDays(parseYmd(s), n - 1));
  state.modal.endTouched = true;
  state.pick.target = 'end';
  updateDays(false);
  renderPicker();
}

function setPickTarget(t) {
  if (!state.pick || state.pick.ro) return;
  state.pick.target = t;
  const d = parseYmd((t === 'start' ? $('fDate').value : $('fEndDate').value) || $('fDate').value || ymd(todayDate()));
  state.pick.y = d.getFullYear();
  state.pick.m = d.getMonth();
  renderPicker();
}

function movePickMonth(dir) {
  const p = state.pick;
  if (!p) return;
  p.m += dir;
  if (p.m < 0) { p.m = 11; p.y--; }
  if (p.m > 11) { p.m = 0; p.y++; }
  renderPicker();
}

function openModal(kind, title, data, readOnly) {
  state.modal = data;
  $('dlgKind').textContent = kind;
  $('dlgTitle').textContent = title;
  $('fTitle').value = data.title;
  document.querySelector('input[name="fCal"][value="' + data.cal + '"]').checked = true;
  updateCalHint();
  $('fDate').value = data.date;
  $('fEndDate').value = data.endDate;
  $('fMemo').value = data.memo;
  updateDays(false);
  startPicker(readOnly);
  $('dlgMsg').textContent = '';
  const del = $('dlgDelete');
  del.style.visibility = data.id && !readOnly ? 'visible' : 'hidden';
  del.classList.remove('armed');
  del.textContent = '삭제';
  $('dlgSave').style.display = readOnly ? 'none' : '';
  ['fTitle', 'fDate', 'fEndDate', 'fMemo'].forEach((id) => { $(id).disabled = !!readOnly; });
  document.querySelectorAll('input[name="fCal"]').forEach((r) => { r.disabled = !!readOnly; });
  $('evBackdrop').classList.add('open');
  if (!readOnly) focusSoon($('fTitle'));
}

function openPopup(p) {
  const w = 520;
  const h = 720;
  const left = Math.round((screen.availLeft || 0) + (screen.availWidth - w) / 2);
  const top = Math.round((screen.availTop || 0) + (screen.availHeight - h) / 2);
  const url = location.origin + location.pathname + '?' + new URLSearchParams(p) + '#key=' + state.key;
  let win = null;
  try { win = window.open(url, 'plannerPopup', 'popup=yes,width=' + w + ',height=' + h + ',left=' + left + ',top=' + top); } catch (e) {}
  state.fastUntil = Date.now() + 3 * 60 * 1000;
  return !!win;
}

function afterChange() {
  if (channel) channel.postMessage('changed');
  if (POPUP) {
    showDone('저장되었습니다');
    return;
  }
  closeModal();
  load();
}

function showDone(msg) {
  document.body.replaceChildren();
  const box = el('div', 'done-screen', msg);
  box.appendChild(el('span', '', '이 창은 자동으로 닫힙니다. 닫히지 않으면 직접 닫아주세요.'));
  document.body.appendChild(box);
  setTimeout(() => window.close(), 300);
}

function openAdd(dateStr) {
  if (WALLPAPER) { openPopup({ popup: 'add', date: dateStr }); return; }
  $('dlgInfo').textContent = '저장하면 구글 캘린더를 거쳐 폰의 삼성 캘린더에도 표시됩니다';
  openModal('새 일정', korDate(parseYmd(dateStr)), { id: '', cal: 'school', title: '', date: dateStr, endDate: dateStr, memo: '' });
}

function openEdit(ev) {
  const date = ev.start.slice(0, 10);
  if (WALLPAPER) { openPopup({ popup: 'edit', id: ev.id, cal: ev.cal, date: date }); return; }
  $('dlgInfo').textContent = ev.recurring ? '반복 일정은 폰의 삼성 캘린더에서 수정해 주세요' : '마지막 수정 ' + ev.updated;
  openModal(ev.recurring ? '반복 일정' : '일정 수정', korDate(parseYmd(date)), {
    id: ev.id, oldCal: ev.cal, cal: ev.cal, title: ev.title, date: date, endDate: lastDay(ev),
    timed: !ev.allDay, origDate: date, origEndDate: lastDay(ev), endTouched: true,
    memo: ev.memo
  }, ev.recurring);
}

function closeModal() {
  if (POPUP) { showDone('취소했습니다'); return; }
  if (document.activeElement) document.activeElement.blur();
  $('evBackdrop').classList.remove('open');
  state.modal = null;
}

async function saveModal() {
  const m = state.modal;
  const payload = {
    cal: document.querySelector('input[name="fCal"]:checked').value,
    title: $('fTitle').value.trim(),
    date: $('fDate').value,
    endDate: $('fEndDate').value || $('fDate').value,
    memo: $('fMemo').value.trim()
  };
  if (!payload.title) { $('dlgMsg').textContent = '제목을 입력해 주세요'; $('fTitle').focus(); return; }
  if (!payload.date) { $('dlgMsg').textContent = '시작일을 선택해 주세요'; return; }
  if (payload.endDate < payload.date) { $('dlgMsg').textContent = '종료일이 시작일보다 빠를 수 없습니다'; return; }
  if (m.timed && payload.date === m.origDate && payload.endDate === m.origEndDate) payload.keepTime = true;
  const btn = $('dlgSave');
  btn.disabled = true;
  btn.textContent = '저장 중…';
  try {
    if (m.id) await api('update', Object.assign(payload, { id: m.id, oldCal: m.oldCal }), true);
    else await api('create', payload, true);
    afterChange();
  } catch (e) {
    $('dlgMsg').textContent = '저장 실패: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '저장';
  }
}

async function deleteModal() {
  const del = $('dlgDelete');
  if (!del.classList.contains('armed')) {
    del.classList.add('armed');
    del.textContent = '한 번 더 누르면 삭제';
    return;
  }
  del.disabled = true;
  try {
    await api('delete', { id: state.modal.id, cal: state.modal.oldCal }, true);
    afterChange();
  } catch (e) {
    $('dlgMsg').textContent = '삭제 실패: ' + e.message;
  } finally {
    del.disabled = false;
  }
}

function openKey(msg) {
  $('keyMsg').textContent = msg || '';
  $('keyBackdrop').classList.add('open');
  $('keyInput').focus();
}

function tick() {
  const d = new Date();
  $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const k = ymd(d);
  if (state.dayKey && state.dayKey !== k) { state.y = d.getFullYear(); state.m = d.getMonth(); state.sel = ''; load(); }
  state.dayKey = k;
  const typing = [$('searchInput'), $('memoFindInput')].indexOf(document.activeElement) !== -1;
  if ((state.sel || state.reorder || state.search || state.memoMode) && !state.modal && !typing && Date.now() - state.selAt > SEL_RESET_MS) {
    state.sel = '';
    state.reorder = false;
    state.moved = '';
    if (state.search) clearSearchUI();
    if (state.memoMode) clearMemoMode();
    const t = todayDate();
    if (state.y !== t.getFullYear() || state.m !== t.getMonth()) { state.y = t.getFullYear(); state.m = t.getMonth(); render(); load(); }
    else { renderGrid(); renderDay(); }
  }
}

function focusSoon(input) {
    [30, 150, 400].forEach((ms) => setTimeout(() => {
    if (document.activeElement === input && document.hasFocus()) return;
    window.focus();
    input.blur();
    input.focus();
  }, ms));
}
['fTitle', 'fMemo', 'todoAdd', 'keyInput', 'searchInput', 'memoText', 'memoFindInput'].forEach((id) => {
  $(id).addEventListener('pointerdown', () => focusSoon($(id)));
});

$('prev').addEventListener('click', () => { state.m--; if (state.m < 0) { state.m = 11; state.y--; } render(); load(); });
$('next').addEventListener('click', () => { state.m++; if (state.m > 11) { state.m = 0; state.y++; } render(); load(); });
$('goToday').addEventListener('click', () => { const t = todayDate(); state.y = t.getFullYear(); state.m = t.getMonth(); render(); load(); });
$('refresh').addEventListener('click', () => location.reload());
$('dayBack').addEventListener('click', () => selectDay(ymd(todayDate())));
$('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) runSearch();
  if (e.key === 'Escape') closeSearch();
});
$('searchInput').addEventListener('input', () => { $('searchWrap').classList.toggle('has', !!$('searchInput').value); });
$('searchClear').addEventListener('click', closeSearch);
$('memoText').addEventListener('input', () => {
  state.memoDirty = true;
  state.memoStatus = '입력 중…';
  $('memoFoot').textContent = state.memoStatus;
  state.selAt = Date.now();
  clearTimeout(memoTimer);
  memoTimer = setTimeout(saveMemo, 1200);
});
$('memoText').addEventListener('blur', () => { if (state.memoDirty) saveMemo(); });
$('memoListBtn').addEventListener('click', () => openMemoMode('list'));
$('memoFindBtn').addEventListener('click', () => openMemoMode('find'));
$('memoClose').addEventListener('click', closeMemoMode);
$('memoFindInput').addEventListener('input', () => {
  state.memoQ = $('memoFindInput').value;
  state.selAt = Date.now();
  renderMemoPanel();
});
$('memoFindInput').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMemoMode(); });
window.addEventListener('beforeunload', () => { if (state.memoDirty) saveMemo(); });
$('searchClose').addEventListener('click', closeSearch);
document.querySelectorAll('.range-chip').forEach((b) => b.addEventListener('click', () => runSearch(b.dataset.range)));
$('dayReorder').addEventListener('click', () => {
  state.reorder = !state.reorder;
  state.moved = '';
  state.selAt = Date.now();
  renderDay();
});
$('dayAdd').addEventListener('click', () => openAdd(state.sel || ymd(todayDate())));
document.addEventListener('pointerdown', () => { state.selAt = Date.now(); });
$('fDate').addEventListener('change', () => updateDays(true));
document.querySelectorAll('input[name="fCal"]').forEach((r) => r.addEventListener('change', updateCalHint));
$('fEndDate').addEventListener('change', () => { if (state.modal) state.modal.endTouched = true; updateDays(false); });
$('pickStart').addEventListener('click', () => setPickTarget('start'));
$('pickEnd').addEventListener('click', () => setPickTarget('end'));
$('miniPrev').addEventListener('click', () => movePickMonth(-1));
$('miniNext').addEventListener('click', () => movePickMonth(1));
document.querySelectorAll('#quickDays button').forEach((b) => b.addEventListener('click', () => quickDays(+b.dataset.days)));
$('dlgClose').addEventListener('click', closeModal);
$('dlgCancel').addEventListener('click', closeModal);
$('dlgSave').addEventListener('click', saveModal);
$('dlgDelete').addEventListener('click', deleteModal);
$('evBackdrop').addEventListener('click', (e) => { if (e.target === $('evBackdrop')) closeModal(); });
$('fTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) saveModal(); });
$('evBackdrop').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
$('todoAdd').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const v = e.target.value.trim();
  if (!v) return;
  state.todos.push({ text: v, done: false });
  e.target.value = '';
  saveTodos();
  $('todoList').scrollTop = $('todoList').scrollHeight;
});
$('keySave').addEventListener('click', () => {
  const k = $('keyInput').value.trim();
  if (!k) return;
  state.key = k;
  saveKey(k);
  $('keyBackdrop').classList.remove('open');
  load();
});

async function startPopup() {
  document.body.classList.add('popup');
  document.title = POPUP === 'edit' ? '일정 수정 · 월간 계획표' : '새 일정 · 월간 계획표';
  const date = PARAMS.get('date') || ymd(todayDate());
  if (POPUP === 'add') { openAdd(date); return; }
  try {
    const next = ymd(addDays(parseYmd(date), 1));
    const res = await api('list', { start: date, end: next });
    state.events = res.events;
    const ev = res.events.find((x) => x.id === PARAMS.get('id') && x.cal === PARAMS.get('cal'));
    if (!ev) throw new Error('일정을 찾을 수 없습니다');
    openEdit(ev);
  } catch (e) {
    openAdd(date);
    $('dlgMsg').textContent = '일정을 불러오지 못했습니다: ' + e.message;
  }
}

function startMain() {
  tick();
  setInterval(tick, 1000);
  render();
  load();
  setInterval(load, REFRESH_MS);
  setInterval(() => { if (state.fastUntil && Date.now() < state.fastUntil) load(); }, 5000);
  setInterval(() => location.reload(), 3 * 60 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  if (channel) channel.onmessage = () => { state.fastUntil = 0; load(); };
}

state.key = loadKey();
if (POPUP) startPopup();
else startMain();
</script>
</body>
</html>
